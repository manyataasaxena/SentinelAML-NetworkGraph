services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelaml
      POSTGRES_USER: sentinelaml
      POSTGRES_PASSWORD: sentinelaml
    ports:
      - "5432:5432"
    volumes:
      - sentinelaml-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelaml -d sentinelaml"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: bitnami/kafka:3.8
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: sentinelaml-kraft-cluster
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - sentinelaml-kafka:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - sentinelaml-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://sentinelaml:sentinelaml@postgres:5432/sentinelaml
      SESSION_SECRET: local-compose-session-secret
      EVENT_PIPELINE_MODE: async
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: sentinelaml-api
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  aml-worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["pnpm", "--filter", "@workspace/api-server", "run", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://sentinelaml:sentinelaml@postgres:5432/sentinelaml
      EVENT_PIPELINE_MODE: async
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: sentinelaml-aml-worker
      KAFKA_GROUP_ID: sentinelaml-aml-worker
      REDIS_URL: redis://redis:6379
      WORKER_ID: aml-worker-compose
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  sentinelaml-postgres:
  sentinelaml-kafka:
  sentinelaml-redis: